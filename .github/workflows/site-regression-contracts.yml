name: Site regression contracts

on:
  push:
    branches:
      - "release/**"
      - "work/**"
  pull_request:

jobs:
  regression-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-regression-contracts.mjs
