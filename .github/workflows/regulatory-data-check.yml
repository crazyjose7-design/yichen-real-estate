name: Regulatory data validation
on:
  push:
    branches:
      - work/city-parameter-files-2026-11-27
    paths:
      - 'regulations/**'
      - 'scripts/validate-regulatory-data.mjs'
      - 'tests/regulatory-data.test.mjs'
      - '.github/workflows/regulatory-data-check.yml'
  pull_request:
    paths:
      - 'regulations/**'
      - 'scripts/validate-regulatory-data.mjs'
      - 'tests/regulatory-data.test.mjs'
      - '.github/workflows/regulatory-data-check.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate legal, city and incentive data
        run: |
          node tests/regulatory-data.test.mjs
          node --test tests/regulation-loader.test.mjs tests/reward-engine.test.mjs tests/tax-additional-tools.test.mjs tests/reward-engine-runtime.test.mjs
          node --check scripts/build-deployment.mjs
          node --check workbench/modules/regulation-data-runtime.js
          node --check workbench/modules/tax-additional-calculations.js
          node --check workbench/modules/tax-additional-tools.js
          node --check workbench/modules/reward-engine-runtime.js
          node --check workbench/modules/land-reward-gate.js
